seo:
  default_role: seo-chief
  auto_triggers:
    seo-chief:
      # Level 1 — Pattern matching (keywords in user request)
      patterns:
        - "SEO"
        - "référencement"
        - "audit SEO"
        - "search ranking"
        - "SERP"
        - "on-page"
        - "meta tags"
        - "challenge the SEO strategy"
        - "challenge la stratégie SEO"
      # Level 2 — Contextual (situations detected during work)
      contexts:
        - "seo_audit_requested"
        - "website_launch"
        - "organic_traffic_drop"
        - "strategy_goals_unstated"
      # Level 3 — Reasoning chain
      reasoning:
        - "organic_visibility_concern"

    seo-scout:
      patterns:
        - "crawl"
        - "sitemap"
        - "robots.txt"
        - "fetch page"
        - "technical SEO"
        - "core web vitals"
        - "indexation"
      contexts:
        - "site_structure_unknown"
        - "pre_audit_reconnaissance"
      reasoning:
        - "structure_must_be_mapped_before_scoring"

    seo-judge:
      patterns:
        - "SEO score"
        - "E-E-A-T"
        - "EEAT"
        - "quality gate"
        - "PageSpeed"
        - "CrUX"
        - "ranking factors"
      contexts:
        - "post_crawl_scoring"
        - "competitive_gap_analysis"
      reasoning:
        - "findings_need_prioritized_scoring"

design:
  default_role: design-engine
  auto_triggers:
    design-engine:
      # Level 1 — Pattern matching (keywords in user request). The persona picks its
      # role (Builder, Reviewer, Redesigner) from the request; the pack has one agent.
      # The vocabulary is the pack's own: bare "design", "UI" or "interface" belong to
      # Forge's architect role and Sentinel's UX review, which coexist with this pack.
      patterns:
        - "Atelier"
        - "/design"
        - "design tokens"
        - "maquette"
        - "wireframe"
        - "landing page"
        - "make it look good"
        - "accessibilité"
        - "accessibility"
        - "refonte"
        - "redesign"
      # Level 2 — Contextual (situations detected during work)
      contexts:
        - "frontend_changes"
        - "new_page"
        - "new_component"
        - "design_tokens_missing"
      # Level 3 — Reasoning chain (discoveries during execution)
      reasoning:
        - "ui_looks_generic"
        - "accessibility_unverified"

ghostwriter:
  default_role: ghostwriter
  auto_triggers:
    ghostwriter:
      patterns:
        - "/ghostwriter"
        - "Ghostwriter"
        - "humanise ce texte"
        - "humaniser ce texte"
        - "humanizer du contenu"
        - "rends ce texte plus naturel"
        - "retire le slop IA de ce texte"
        - "enlève les patterns IA de cette réponse"
        - "remove AI slop from this draft"
        - "humanize this text"
        - "make this sound less robotic"
        - "humanize este texto"
        - "deixe este texto mais natural"
        - "revise this draft in our voice"
        - "révise ce texte dans notre ton"
        - "adapte este texto à nossa voz"
      contexts:
        - "editorial_review_requested"
        - "existing_text_style_revision_requested"
        - "voice_profile_requested"

# The packs below declare no other triggers: these entries only name the phrases that open
# bmad-plus-challenge for the persona that drives it. The persona keeps its role.
dev-studio:
  default_role: pm-agent
  auto_triggers:
    analyst-agent:
      patterns:
        - "challenge the product brief"
        - "challenge le product brief"
      contexts:
        - "brief_target_user_unchosen"
    pm-agent:
      patterns:
        - "challenge the PRD scope"
        - "stress-test the requirements"
        - "challenge le périmètre du PRD"
      contexts:
        - "prd_about_to_freeze"
    architect-agent:
      patterns:
        - "challenge the ADRs"
        - "stress-test the epics"
        - "challenge les ADR"
      contexts:
        - "architecture_choices_open"

shield:
  default_role: shield-orchestrator
  auto_triggers:
    shield-orchestrator:
      patterns:
        - "challenge the compliance scope"
        - "challenge le périmètre de conformité"
