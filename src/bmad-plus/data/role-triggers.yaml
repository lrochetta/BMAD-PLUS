      patterns:
        - "sprint"
        - "planning"
        - "story"
        - "retro"
        - "backlog"
        - "epic"
        - "velocity"
      contexts:
        - "phase_transition"
        - "milestone_reached"
        - "team_sync"

    quick-flow:
      patterns:
        - "rapide"
        - "quick"
        - "hotfix"
        - "petit fix"
        - "simple"
        - "fast"
        - "patch"
      contexts:
        - "single_file_change"
        - "bug_report"
        - "minor_feature"

    autopilot:
      patterns:
        - "autopilot"
        - "gère tout"
        - "lance le projet"
        - "full pipeline"
        - "tout automatique"
        - "from scratch"
      contexts:
        - "new_project_idea"
        - "execution_mode_autopilot"
        - "pack_pipeline_declared"

    parallel-supervisor:
      patterns:
        - "parallèle"
        - "parallel"
        - "simultané"
        - "concurrent"
        - "batch"
      contexts:
        - "independent_stories_detected"
        - "multi_task_queue"
        - "parallel_execution_enabled"
        - "swarm_declared"
        - "panel_requested"
      reasoning:
