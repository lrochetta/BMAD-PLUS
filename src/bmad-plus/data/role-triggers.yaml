# BMAD+ Auto-Activation Role Triggers
# These rules define when agents automatically switch roles based on context.
# Users can always override with "skip" or explicitly request a role change.

strategist:
  default_role: pm
  auto_triggers:
    analyst:
      # Level 1 — Pattern matching (keywords in user request)
      patterns:
        - "analyse"
        - "analyze"
        - "recherche"
        - "research"
        - "marché"
        - "market"
        - "benchmark"
        - "requirements"
        - "domain"
        - "competitive"
        - "SWOT"
        - "stakeholder"
      # Level 2 — Contextual (situations detected during work)
      contexts:
        - "new_project"
        - "pivot"
        - "competitor_mention"
        - "unknown_domain"
      # Level 3 — Reasoning chain (discoveries during execution)
      reasoning:
        - "user_need_unclear"
        - "market_assumption_unvalidated"

    pm:
      patterns:
        - "PRD"
        - "product brief"
        - "roadmap"
        - "priorisation"
        - "MVP"
        - "user story"
        - "personas"
        - "brief"
      contexts:
        - "post_research"
        - "planning_phase"
        - "scope_definition"
      reasoning:
        - "research_complete_needs_specification"

    # `challenge` names the skill bmad-plus-challenge, not a persona: the agent keeps its
    # role and opens the skill. The generic phrases live here, on Atlas; each other agent
    # below carries longer phrases that name its own subject, which are the more specific.
    challenge:
      patterns:
        - "stress-test"
        - "stress test"
        - "challenge my plan"
        - "poke holes"
        - "grill the plan"
        - "challenge the brief"
        - "challenge the PRD"
        - "challenge mon plan"
        - "critique mon plan"
        - "trouve les failles"
        - "challenge mon brief"
      contexts:
        - "brief_about_to_freeze"
        - "plan_with_open_dependencies"
      reasoning:
        - "choices_unmade_behind_the_document"

architect-dev:
  default_role: dev
  auto_triggers:
    architect:
      patterns:
        - "architecture"
        - "design"
        - "API"
        - "schema"
        - "structure"
        - "stack"
        - "scalab"
        - "infrastructure"
        - "database"
        - "migration"
      contexts:
        - "multi_file_change_gt_5"
        - "new_module"
        - "security_domain"
        - "performance_critical"
        - "new_integration"
      reasoning:
        - "implementation_exposes_architectural_issue"
        - "dependency_conflict_detected"
        - "scale_concern_during_coding"

    dev:
      patterns:
        - "implement"
        - "implémente"
        - "code"
        - "build"
        - "fix"
        - "refactor"
        - "develop"
        - "créer"
      contexts:
        - "post_architecture"
        - "story_assigned"
        - "bug_fix"
      reasoning:
        - "architecture_approved_ready_to_code"

    tech-writer:
      patterns:
        - "document"
        - "README"
        - "changelog"
        - "explain"
        - "documente"
        - "API doc"
        - "mermaid"
      contexts:
        - "post_implementation"
        - "version_release"
        - "onboarding_needed"
      reasoning:
        - "complex_feature_needs_explanation"
        - "public_api_changed"

    challenge:
      patterns:
        - "challenge the architecture"
        - "stress-test the architecture"
        - "challenge the refactor"
        - "challenge mon architecture"
        - "critique mon architecture"
      contexts:
        - "architecture_with_open_choices"
        - "irreversible_step_planned"
      reasoning:
        - "refactor_target_not_agreed"

quality:
  default_role: qa
  auto_triggers:
    qa:
      patterns:
        - "test"
        - "QA"
        - "review"
        - "bug"
        - "edge case"
        - "coverage"
        - "valide"
        - "vérifie"
      contexts:
        - "post_implementation"
        - "financial_calculations"
        - "security_sensitive"
        - "user_data_handling"
      reasoning:
        - "critical_logic_detected"
        - "regression_risk"
        - "complex_state_management"

    ux-review:
      patterns:
        - "UX"
        - "interface"
        - "utilisateur"
        - "responsive"
        - "accessibilité"
        - "accessibility"
        - "design"
        - "usability"
      contexts:
        - "frontend_changes"
        - "new_component"
        - "new_page"
        - "mobile_layout"
      reasoning:
        - "user_facing_feature_delivered"
        - "interaction_pattern_changed"

    uat:
      patterns:
        - "recette"
        - "recettage"
        - "UAT"
        - "acceptance test"
        - "cahier de recette"
        - "test humain"
        - "test manuel"
        - "what should I check"
        - "qu'est-ce que je dois vérifier"
      contexts:
        - "release_candidate"
        - "deployed_to_test_environment"
        - "uat_results_detected"
      reasoning:
        - "human_observable_change_delivered"
        - "delivery_awaiting_human_acceptance"

    challenge:
      patterns:
        - "attack the plan"
        - "unproven assumption"
        - "challenge the assumptions"
        - "attaque le plan"
        - "hypothèse non prouvée"
      contexts:
        - "plan_assumption_unproven"
      reasoning:
