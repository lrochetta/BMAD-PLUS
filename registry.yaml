# ═══════════════════════════════════════════════════════════════════════════
# BMAD+ REGISTRY — SINGLE SOURCE OF TRUTH (Pillar 1, production)
# ═══════════════════════════════════════════════════════════════════════════
# This file is the ONE place where packs / agents / skills / ordering are
# declared. `node tools/build/generate.js` GENERATES the downstream artifacts
# from it: PACKS / PACK_ORDER / EXPECTED_AGENTS / DERIVED in tools/cli/lib/packs.js
# and the pack metadata of src/bmad-plus/module.yaml.
#
# Derived from the north-star prototype (audit/2026-07-01/north-star/registry.yaml)
# and RECONCILED to exactly match the current tools/cli/lib/packs.js so the
# migration is provably lossless.
#
# Field semantics per pack:
#   order          — install/display order (drives PACK_ORDER)
#   cli            — the EXACT strings the CLI uses today (packs.js `name`,
#                    `icon` glyph letter, `desc`). Display metadata for humans
#                    lives in `display_name` / `icon_emoji` / `summary`.
#   agents         — agent ids (roster). Loose packs install each id as a
#                    directory under src/bmad-plus/agents/ (packs.js `agents`);
#                    packaged packs ship their agents inside pack_dir instead.
#   skills         — skill dirs the CLI installs (packs.js `skills`)
#   data           — data files (only present when packs.js declares `data`;
#                    presence/absence of this key is significant)
#   external_package — extra npm-shipped directory (packs.js `externalPackage`)
#   pack_dir / pack_src_dir — packaged-layout source dir (packs.js `packDir` /
#                    `packSrcDir`). Every declared source path must exist:
#                    `generate.js --check` fails on a missing one.
#   required       — only `true` is emitted (packs.js omits the key otherwise)
#   install_layout — `loose`   : agent DIRECTORIES copied into .agents/skills/
#                    `packaged`: a single packDir copied; agent FILES live inside
#                    (drives EXPECTED_AGENTS for `bmad-plus doctor`)
#   doctor.pack_agents — agent FILENAMES inside packDir (packaged layout only)
#   doctor.required_resources — additional required files relative to pack_dir
#
# Counts (agent totals, framework totals) are DERIVED by the generator from
# the lists below. No human ever types a count → docs cannot drift or lie.
# ═══════════════════════════════════════════════════════════════════════════

schema_version: 1

product:
  # NOTE: `code` is subject to the trademark remediation (audit CG-01) — the
  # distribution name may change; the generator makes a rename a one-command regen.
  code: bmad-plus
  display_name: "BMAD+"
  version: 0.22.0 # `--check` asserts this == package.json version (kills XCUT-01 drift)
  derived_from: "BMAD-METHOD v6.6.0"
  attribution_required: true # upstream MIT notice must be retained (audit CG-04)

# ── Portability spine (Pillar 5) ─────────────────────────────────────────────
# Every capability must be expressible via the AGENTS.md spine or an MCP tool.
# Adapters below are GENERATED, never hand-edited → they cannot drift.
targets:
  spine: AGENTS.md
  # Describes BMAD+'s delivered integration, not capabilities of the host itself.
  integration: { execution: host-managed, lifecycle_events: not-integrated }
  optional_process_backend:
    adapters: [command, codex-exec]
    supervisor: foreground
    launch: explicit-plan
    collect: exact-attempt-receipt
    cancellation: original-owner-direct-child
    verification: independent-required
    scheduling: none
  adapters:
    - { tool: claude-code, file: CLAUDE.md }
    - { tool: gemini-cli, file: GEMINI.md }
    - { tool: antigravity, file: GEMINI.md }
    - { tool: cursor, file: .cursor/rules/bmad-plus.mdc }
    - { tool: codex-cli, file: .codex/AGENTS.md }
    - { tool: opencode, file: .opencode/AGENTS.md }
    - { tool: aider, file: CONVENTIONS.md }
  models_supported: [claude, gpt, gemini, local] # model-agnostic by contract

# ── Runtimes (Pillar 2 — unified provisioning) ───────────────────────────────
# Python provisioning is opt-in via --provision-python for declared Python packs.
runtimes:
  node: { min_version: "20.0.0" }
  python: { min_version: "3.11", provisioner: uv, fallback: pipx }

# ── Karpathy Learning Layer (Pillar 3) ───────────────────────────────────────
memory:
  scopes:
    project: ".agents/memory/{decisions,lessons,patterns,context}.md"
    portfolio: "D:/travail/DEV/_brain" # cross-project brain
  index: { engine: chromadb, embedder: sentence-transformers } # reuse mcp-server/ RAG
  guardrails: [G1-think-before-coding, G2-simplicity-first, G3-surgical-changes, G4-goal-driven]
  reward_signal:
    inputs: [eval_score, user_acceptance, ci_outcome]
    applies_to: [retrieval_weights, playbooks, guardrail_thresholds] # prompt-level only
    governed_by: shield # bounded self-modification, versioned & reversible

# ── Quality proof (Pillar 4) ─────────────────────────────────────────────────
eval:
  suite_glob: "evals/*/*/eval.yaml"
  gates:
    pr:
      mode: replay
      blocking: true
      require_all_packs: true
      controls: [completion-only, interrupted]
    model_upgrade:
      mode: native-host
      blocking: false
      minimum_repetitions: 2
      require_paired_variants: true

# ── Data handling (egress doctrine) ──────────────────────────────────────────
# What the npm payload sends, to whom, when, and under which consent. Every place
# the shipped code opens a connection, listens on a port or starts a process is a
# site, keyed by file and call with its count; `node tools/build/verify-egress.js`
# (CI) fails when a site is undeclared, gone or miscounted, and renders the flows
# into SECURITY.md. Spec: docs/specs/data-handling.md.
#   egress         none      — stays on the machine (local process, loopback listener)
#                  direct    — this code sends over the network
#                  delegated — starts a program that may itself use the network
#   consent.basis  invocation — only when the user runs that command, script or page
#                  opt-in     — off until a flag or policy enables it
#                  opt-out    — on by default; `how` names the switch that stops it
#                  credential — only once the user supplies that provider's key or URL
data_handling:
  # Third-party code is not scanned: a new runtime dependency is reviewed for what
  # it sends before it is added here, or the gate fails.
  runtime_dependencies: ["@clack/prompts", commander, fs-extra, js-yaml, picocolors, semver]
  # Local modules that reach a capability. A wrapper is a capability as a whole:
  # each caller of any name it offers is a site of its own, except the names listed
  # as `pure` (no network, listener or process, whatever the arguments). Every name
  # it offers is listed in `exports` or `pure`. Its internal sites are described by
  # the flows of its callers.
  wrappers:
    - file: tools/cli/lib/npm-runner.js
      exports: [createNpmRunner, runNpm]
      pure: [resolveNpmCli]
      sites: { child_process.spawn: 1 }
    - file: tools/cli/lib/python-provision.js
      exports: [defaultRunner, detectPython, detectProvisioner, createEnv, installRequirements, verifyImports, verifyEntry, provisionPack]
      pure: [parsePythonVersion, meetsMinVersion, pythonCandidates, chooseProvisioner, venvPython, buildEnvCommands, missingPythonGuidance]
      sites: { child_process.spawnSync: 1 }
    - file: osint-agent-package/skills/bmad-osint-investigate/osint/scripts/_http.py
      exports: [https_request, api_post, api_get]
      pure: [_check_https_url, get_key, get_workspace, truncate]
      sites: { http.client.HTTPSConnection: 1 }
    - file: src/bmad-plus/packs/pack-seo/scripts/seo_fetch.py
      exports: [resolve_public_address, resolve_target, is_safe_url, _PinnedPoolManager, PinnedAddressAdapter, create_session, fetch_page, main]
      pure: [_ip_is_blocked, check_url]
      sites: { requests.Session: 2, requests.adapters.HTTPAdapter: 1, urllib3.PoolManager: 1, socket.getaddrinfo: 1 }
  # Maintainer services deployed from this repository, outside the npm package. Their
  # tracked files are scanned like the payload (tests and CI smoke excluded: never
  # deployed); `dependencies` mirrors requirements.txt, whose code is not scanned.
  services:
    - id: mcp-server
      root: mcp-server
      purpose: "The Audit 360° MCP server the maintainer runs on a VPS: git, GitHub, Gamma, CI, RAG and memory tools for the maintainer's agents, behind a bearer token and a password-protected dashboard."
      requirements: mcp-server/requirements.txt
      dependencies: [mcp, uvicorn, chromadb, sentence-transformers, torch, gitpython, requests, pyyaml, pypdf, defusedxml]
      exclude: ["**/test_*.py", "ci/**"]
    - id: monitor
      root: monitor
      purpose: "The upstream monitor the maintainer schedules on a VPS: it watches the BMAD-METHOD repository and notifies the maintainer of new changes."
      requirements: monitor/requirements.txt
      dependencies: [google-genai, requests, PyYAML]
      exclude: ["**/test_*.py"]
  # Module loads the scan cannot resolve (`require(<expression>)`, a loader handed
  # on, eval): local modules only, named here so a new one is reviewed.
  dynamic_loads:
    - { file: tools/cli/bmad-plus-cli.js, count: 1, loads: "the command modules under tools/cli/commands/" }
    - { file: tools/build/generate.js, count: 1, loads: "the generated tools/cli/lib/packs.js compared by --check" }
  flows:
    - id: update-check
      component: cli
      egress: delegated
      purpose: "Asks npm which bmad-plus release the policy channel points to."
      sends: "The package name and channel (`npm view bmad-plus@latest`) with npm's request metadata: IP address, user agent (npm, Node.js and OS versions) and npm session headers."
      recipients: ["registry.npmjs.org (the policy accepts no other registry)"]
      trigger: "`bmad-plus update-check`, which the generated adapters ask the agent to run once per session; the answer is cached in `.bmad/update-check.json`."
      consent: { basis: opt-out, how: "`bmad-plus update-policy --mode off` stops every lookup." }
      sites:
        tools/cli/lib/update-check.js: { npm-runner.runNpm: 1 }
    - id: update-apply
      component: cli
      egress: delegated
      purpose: "Runs the chosen release through `npm exec` to update the project."
      sends: "The exact release requested, with npm's request metadata, to download that version's package."
      recipients: ["registry.npmjs.org"]
      trigger: "`bmad-plus update --latest --yes`, or `--auto` when the project policy allows it."
      consent: { basis: opt-in, how: "Each run needs `--yes`, or policy mode `auto` with an explicit range (`bmad-plus update-policy --mode auto --range <range>`)." }
      sites:
        tools/cli/lib/update-dispatch.js: { npm-runner.runNpm: 1 }
    - id: python-provision
      component: cli
      egress: delegated
      purpose: "Creates an isolated environment for a Python pack and installs its pinned requirements with uv, pipx or pip."
      sends: "The names and versions in the pack's requirements.txt, with the installer's request metadata; uv may also download a Python build."
      recipients: ["pypi.org and files.pythonhosted.org, or the index configured for pip or uv on the machine", "github.com (python-build-standalone releases) when uv downloads Python"]
      trigger: "`bmad-plus install --provision-python` for a selected Python pack."
      consent: { basis: opt-in, how: "Only with `--provision-python`; without it no environment is created." }
      sites:
        tools/cli/commands/install.js: { python-provision.provisionPack: 1 }
    - id: nexus-worker
      component: cli
      egress: delegated
      purpose: "Launches the worker a Nexus plan declares: a fixed command, or `codex exec`."
      sends: "With `codex-exec`, the task's instruction and input files (at most 1 MiB) go to Codex CLI, which sends them to the model provider of the user's own Codex login. With `command`, whatever that command sends."
      recipients: ["the model provider configured in the user's Codex CLI", "whoever a declared command contacts"]
      trigger: "`bmad-plus nexus launch` on a plan with an explicit execution contract."
      consent: { basis: invocation, how: "Nothing starts without a plan the user wrote and an explicit launch; shell, environment and arbitrary Codex flags are refused." }
      sites:
        tools/cli/lib/nexus-process.js: { child_process.spawn: 1 }
    - id: nexus-verifier
      component: cli
      egress: delegated
      purpose: "Runs the verifier command a Nexus plan declares: node or an absolute executable, literal arguments, no shell."
      sends: "Whatever the declared command sends; it runs with a minimal allow-listed environment."
      recipients: ["whoever the declared command contacts"]
      trigger: "`bmad-plus nexus verify` on a task of a plan the user wrote."
      consent: { basis: invocation, how: "The command and its hash are fixed in the plan; a changed executable is refused." }
      sites:
        tools/cli/lib/nexus.js: { child_process.spawn: 1 }
    - id: uat-page-results
      component: core
      egress: direct
      purpose: "Saves the tester's verdicts from an acceptance recipe page."
      sends: "The run: tester name, step verdicts and notes."
      recipients: ["the origin serving the page: `bmad-plus uat serve` on 127.0.0.1, or the claude.ai artifact store when the page is published as an artifact"]
      trigger: "Each recorded verdict, when the page is served; a page opened from a file keeps results in the browser."
      consent: { basis: invocation, how: "The tester chooses how the page is opened; a page opened from a file sends nothing." }
      sites:
        src/bmad-plus/skills/bmad-plus-uat/template/page.html: { global.fetch: 3 }
    - id: osint-providers
      component: osint
      egress: direct
      purpose: "Runs the OSINT search, extraction and scraping scripts against the providers the investigator configured."
      sends: "The investigation query (names, handles, keywords and URLs about the subject) and that provider's API key, over verified HTTPS: the shared helper refuses any other scheme and any redirect off the provider's host."
      recipients: ["api.apify.com", "api.exa.ai", "r.jina.ai, s.jina.ai, deepsearch.jina.ai", "api.parallel.ai", "api.perplexity.ai", "api.tavily.com", "the Bright Data MCP URL the user configures"]
      trigger: "When the Shadow agent, or `volley.py` fanning out to the others, runs a provider script during an investigation."
      consent: { basis: credential, how: "A provider is contacted only once its key (or Bright Data MCP URL) is set; the skill's Phase −1 lawful-basis gate precedes profiling a named person." }
      sites:
        osint-agent-package/skills/bmad-osint-investigate/osint/scripts/apify.py: { _http.api_post: 1, _http.api_get: 5 }
        osint-agent-package/skills/bmad-osint-investigate/osint/scripts/brightdata.py: { subprocess.run: 2 }
        osint-agent-package/skills/bmad-osint-investigate/osint/scripts/exa.py: { _http.api_post: 2 }
        osint-agent-package/skills/bmad-osint-investigate/osint/scripts/jina.py: { _http.https_request: 3 }
        osint-agent-package/skills/bmad-osint-investigate/osint/scripts/mcp-client.py: { http.client.HTTPSConnection: 1 }
        osint-agent-package/skills/bmad-osint-investigate/osint/scripts/parallel.py: { _http.api_post: 3 }
        osint-agent-package/skills/bmad-osint-investigate/osint/scripts/perplexity.py: { _http.api_post: 3 }
        osint-agent-package/skills/bmad-osint-investigate/osint/scripts/tavily.py: { _http.api_post: 2 }
        osint-agent-package/skills/bmad-osint-investigate/osint/scripts/volley.py: { subprocess.run: 1 }
    - id: seo-site-fetch
      component: seo
      egress: direct
      purpose: "Fetches and crawls the audited site through the SSRF-checked, address-pinned session."
      sends: "HTTP requests for the audited site's pages, robots.txt and sitemap, with the user agent the audit selects, from the user's IP address."
      recipients: ["the site the user asks to audit (public addresses only)"]
      trigger: "`seo_fetch.py` and `seo_crawl.py`, run by the SEO agents during an audit."
      consent: { basis: invocation, how: "Only the URL the user gives and its internal links are fetched; private, loopback and link-local addresses are refused." }
      sites:
        src/bmad-plus/packs/pack-seo/scripts/seo_crawl.py: { seo_fetch.create_session: 1 }
    - id: seo-google-apis
      component: seo
      egress: direct
      purpose: "Queries PageSpeed Insights, the Chrome UX Report and the mobile-friendly test for the audited URL."
      sends: "The audited URL or origin, and the user's GOOGLE_API_KEY in the x-goog-api-key header, never in the request URL; redirects are not followed."
      recipients: ["www.googleapis.com", "chromeuxreport.googleapis.com", "searchconsole.googleapis.com"]
      trigger: "`seo_apis.py`, run during an audit's performance phase."
      consent: { basis: credential, how: "Only when GOOGLE_API_KEY is set; without it the script returns an error and sends nothing." }
      sites:
        src/bmad-plus/packs/pack-seo/scripts/seo_apis.py: { requests.Session: 1 }
    - id: seo-screenshot
      component: seo
      egress: delegated
      purpose: "Captures the audited page in a headless Chromium driven by Playwright, pinned to the address `seo_fetch.py` validated."
      sends: "Chromium's requests for the audited page and the resources its own host serves, with a browser user agent, from the user's IP address. Third-party resources are blocked, not fetched."
      recipients: ["the site the user asks to audit (public addresses only)"]
      trigger: "`seo_screenshot.py`, when an audit asks for screenshots."
      consent: { basis: invocation, how: "Only the URL the user gives, with the Playwright and Chromium the user installed; non-public addresses, other hosts and redirects off the host are refused." }
      sites:
        src/bmad-plus/packs/pack-seo/scripts/seo_screenshot.py: { playwright.sync_api.sync_playwright: 1, seo_fetch.resolve_target: 1 }
    - id: npx-launcher
      component: cli
      egress: none
      purpose: "Starts the CLI in the same Node.js executable."
      trigger: "Every `npx bmad-plus` run."
      sites:
        tools/bmad-plus-npx.js: { child_process.spawnSync: 1 }
    - id: python-health
      component: cli
      egress: none
      purpose: "Runs a pack environment's own Python, isolated (-I), to confirm its modules import."
      trigger: "`bmad-plus doctor` on a project with a provisioned Python pack."
      sites:
        tools/cli/lib/python-health.js: { python-provision.defaultRunner: 1 }
    - id: review-git
      component: cli
      egress: none
      purpose: "Reads the local repository with git (rev-parse, merge-base, diff, ls-files, show) to build a review scope."
      trigger: "`bmad-plus review` commands."
      sites:
        tools/cli/lib/review.js: { child_process.spawnSync: 1 }
    - id: assurance-checks
      component: cli
      egress: delegated
      purpose: "Runs the checks an assurance case declares, without a shell and with a minimal environment, and reads the commit and working-tree state with git to date the evidence."
      sends: "Whatever a declared check command sends; the CLI itself sends nothing."
      recipients: ["whoever a declared check command contacts"]
      trigger: "`bmad-plus assurance run` on a case the user wrote."
      consent: { basis: invocation, how: "Only the commands listed in the user's own case file run, and only on an explicit `assurance run`; the signing key is never passed to a check." }
      sites:
        tools/cli/lib/assurance.js: { child_process.spawn: 1, child_process.spawnSync: 1 }
    - id: nexus-git
      component: cli
      egress: none
      purpose: "Reads the repository root and HEAD commit with `git rev-parse`."
      trigger: "`bmad-plus nexus` plan and run commands."
      sites:
        tools/cli/lib/nexus.js: { child_process.spawnSync: 2 }
    - id: uat-serve
      component: cli
      egress: none
      purpose: "Serves a recipe page and stores its verdicts, listening on 127.0.0.1 only and refusing any other Host header."
      trigger: "`bmad-plus uat serve`."
      sites:
        tools/cli/commands/uat.js: { http.createServer: 1 }
    - id: uat-release-gate
      component: core
      egress: none
      purpose: "Runs the project's own bmad-plus CLI with the current Node.js to grade recorded acceptance runs."
      trigger: "The release-gate script a project copies from the UAT skill, when the project runs it."
      sites:
        src/bmad-plus/skills/bmad-plus-uat/templates/uat-release-gate.mjs: { child_process.spawnSync: 1 }
    - id: osint-install
      component: osint
      egress: none
      purpose: "Copies the OSINT agent and skills into a BMAD project, then runs the pack's local diagnostic script with the system Python."
      trigger: "When the user runs the package's install.sh or install.ps1."
      sites:
        osint-agent-package/install.sh: { shell.python3: 3 }
        osint-agent-package/install.ps1: { shell.python: 2 }
    # ── Maintainer services (data_handling.services) ──
    - id: mcp-listener
      component: mcp-server
      egress: direct
      purpose: "Serves the MCP tools over SSE and the audit dashboard with its JSON API."
      sends: "Tool results (repository contents and diffs, command output, audit reports, knowledge-base passages, memory entries) and the dashboard's audit data."
      recipients: ["MCP clients presenting the bearer token", "dashboard users logged in with the dashboard password"]
      trigger: "While the service runs: HTTPS on 0.0.0.0:443 when SSL_CERT_FILE and SSL_KEY_FILE are set, plain HTTP on 127.0.0.1:8000 with BMAD_DEV=1, otherwise it refuses to start."
      consent: { basis: credential, how: "Every MCP request needs MCP_AUDIT360_TOKEN and every dashboard request the dashboard password; 30 requests per minute per address." }
      sites:
        mcp-server/server.py: { uvicorn.run: 2 }
        mcp-server/dashboard.html: { global.fetch: 2 }
    - id: mcp-dashboard-cdn
      component: mcp-server
      egress: direct
      purpose: "Loads Chart.js for the audit dashboard."
      sends: "The dashboard user's IP address, user agent and the dashboard origin as referrer."
      recipients: ["cdn.jsdelivr.net"]
      trigger: "Each time the dashboard page is opened."
      consent: { basis: invocation, how: "Opening the dashboard loads it." }
      sites:
        mcp-server/dashboard.html: { markup.remote-load: 1 }
    - id: mcp-knowledge-ingest
      component: mcp-server
      egress: delegated
      purpose: "Builds the RAG knowledge base: clones or pulls the listed sources and embeds them with a sentence-transformers model."
      sends: "Git clone and pull requests for the sources in knowledge/sources.json, and the model download request (model name, library version) on first use."
      recipients: ["the Git hosts of the configured knowledge sources", "huggingface.co (the embedding model named by RAG_EMBEDDING_MODEL or the default)"]
      trigger: "At server start when the knowledge base is empty, and on the admin_refresh_knowledge tool."
      consent: { basis: invocation, how: "The maintainer lists the sources; chromadb runs with anonymized_telemetry=False." }
      sites:
        mcp-server/ingestion_startup.py: { subprocess.Popen: 1 }
        mcp-server/ingest.py: { git.Repo: 1, git.Repo.clone_from: 1, sentence_transformers.SentenceTransformer: 1 }
        mcp-server/rag.py: { sentence_transformers.SentenceTransformer: 1 }
        mcp-server/tools/rag_tools.py: { subprocess.Popen: 1 }
    - id: mcp-git-tools
      component: mcp-server
      egress: delegated
      purpose: "Runs git for the git_* tools and clones the repositories to audit."
      sends: "Clone, pull and push traffic for the repositories a client names, with the credentials git holds on the server; pushes carry the commits made through git_commit."
      recipients: ["the Git hosts of the repositories the client names (URLs validated before cloning)"]
      trigger: "git_* tools, audit_scan_repo and orchestrate_full_audit, when an authenticated client calls them."
      consent: { basis: credential, how: "Only through an authenticated MCP call; paths are confined to the server's repository root." }
      sites:
        mcp-server/tools/git_ops.py: { git.Repo: 9, git.Repo.clone_from: 1 }
        mcp-server/tools/audit_engine.py: { git.Repo.clone_from: 1 }
        mcp-server/tools/orchestrator.py: { git.Repo.clone_from: 1 }
    - id: mcp-github-api
      component: mcp-server
      egress: direct
      purpose: "Manages GitHub repositories, files, pull requests and collaborators for the maintainer's account."
      sends: "GITHUB_TOKEN with the repository names, file contents, pull-request texts and collaborator names the client passes; orchestrate_full_audit creates a private delivery repository."
      recipients: ["api.github.com"]
      trigger: "github_* tools and orchestrate_full_audit, when an authenticated client calls them."
      consent: { basis: credential, how: "Only with GITHUB_TOKEN set on the server and an authenticated MCP call." }
      sites:
        mcp-server/tools/github_ops.py: { requests.post: 2, requests.get: 3, requests.put: 2, requests.delete: 1 }
        mcp-server/tools/orchestrator.py: { requests.post: 1 }
    - id: mcp-gamma
      component: mcp-server
      egress: direct
      purpose: "Generates audit reports from a Gamma template and downloads their PDF exports."
      sends: "The report content (Markdown, title, infographic URLs, instructions) and GAMMA_API_KEY; export downloads carry no content."
      recipients: ["public-api.gamma.app", "the export host named in Gamma's answer"]
      trigger: "gamma_* tools, when an authenticated client calls them."
      consent: { basis: credential, how: "Only with GAMMA_API_KEY set on the server and an authenticated MCP call." }
      sites:
        mcp-server/tools/gamma_report.py: { requests.post: 1, requests.get: 4 }
    - id: mcp-ci-tools
      component: mcp-server
      egress: delegated
      purpose: "Runs allow-listed build, test and deploy commands, Semgrep and Trivy on repositories under ALLOWED_REPO_ROOT."
      sends: "Whatever those programs send: dependency downloads of npm, pip, cargo or go, Semgrep's registry requests for --config=auto, Trivy's vulnerability-database download, and whatever a repository's deploy script sends."
      recipients: ["the package registries of the repository's toolchain", "semgrep.dev", "Trivy's database mirrors", "whoever a repository's deploy script contacts"]
      trigger: "ci_* tools, when an authenticated client calls them."
      consent: { basis: credential, how: "Only through an authenticated MCP call; commands must equal an allow-listed argv, deploy scripts must lie inside the repository." }
      sites:
        mcp-server/tools/ci_cd.py: { subprocess.run: 4 }
    - id: mcp-memory
      component: mcp-server
      egress: none
      purpose: "Runs the bmad-plus CLI's `mem` command with the server's Node.js for the memory tools."
      trigger: "memory_* tools, when an authenticated client calls them."
      sites:
        mcp-server/tools/memory_tools.py: { subprocess.run: 1 }
    - id: monitor-upstream-git
      component: monitor
      egress: delegated
      purpose: "Fetches the watched upstream ref into a bare cache with git, HTTPS only and hooks disabled."
      sends: "Git fetch requests for the configured upstream ref, with the host's IP address."
      recipients: ["github.com (bmad-code-org/BMAD-METHOD, or the HTTPS repository the configuration names)"]
      trigger: "Each scheduled run of weekly-check.py."
      consent: { basis: invocation, how: "The maintainer installs the schedule and chooses the repository and ref." }
      sites:
        monitor/git_snapshot.py: { subprocess.Popen: 1 }
    - id: monitor-ai-analysis
      component: monitor
      egress: direct
      purpose: "Asks a Gemini model for an advisory review of the upstream changes."
      sends: "Bounded excerpts of the upstream commit messages, diff statistics and diff, the previous observed version, and the configured API key."
      recipients: ["generativelanguage.googleapis.com (Google Gemini API)"]
      trigger: "weekly-check.py --ai, when a change is observed."
      consent: { basis: opt-in, how: "Only with --ai and an API key and model list in the configuration; --dry-run never calls it." }
      sites:
        monitor/ai_analyzer.py: { google.genai: 2, google.genai.Client: 1 }
    - id: monitor-notify
      component: monitor
      egress: direct
      purpose: "Tells the maintainer about an observed upstream change."
      sends: "The observation report: upstream version and commit summaries, with the advisory analysis when one was requested."
      recipients: ["the Evolution API instance the configuration names (loopback unless HTTPS), which relays it to the configured WhatsApp number", "the SMTP server of the fallback email configuration (STARTTLS)"]
      trigger: "weekly-check.py --notify, once per newly observed upstream state."
      consent: { basis: opt-in, how: "Only with --notify and a configured channel; --dry-run never notifies." }
      sites:
        monitor/notifier.py: { requests: 2, requests.post: 1, smtplib.SMTP: 1 }
    - id: monitor-mcp-bridge
      component: monitor
      egress: direct
      purpose: "Client library that delegates git and GitHub operations to the Audit 360° MCP server."
      sends: "Tool names and arguments (repository URLs and paths, pull-request texts) with the MCP bearer token."
      recipients: ["the maintainer's MCP server (VPS_HOST or the configured mcp_url)"]
      trigger: "When code constructs an MCPBridge; weekly-check.py does not."
      consent: { basis: credential, how: "Only with an MCP token and server address supplied by the maintainer." }
      sites:
        monitor/mcp_bridge.py: { requests: 2, requests.post: 1 }

# ═══════════════════════════════════════════════════════════════════════════
# PACKS — the one true list. `order` = install/display order.
# ═══════════════════════════════════════════════════════════════════════════
packs:
  core:
    order: 0
    display_name: "Core Development"
    icon_emoji: "⚙️"
    cli: { name: "Core", icon: "b", desc: "Core agents & skills" }
    required: true
    runtime: [node]
    summary: "Multi-role agents for the full development lifecycle."
    agents: [agent-strategist, agent-architect-dev, agent-quality, agent-orchestrator]
    personas:
      - { id: agent-strategist, name: Atlas, role: Strategist, description: "Business analysis + Product management" }
      - { id: agent-architect-dev, name: Forge, role: Architect-Dev, description: "Architecture + Development + Documentation" }
      - { id: agent-quality, name: Sentinel, role: Quality, description: "QA + UX review" }
      - { id: agent-orchestrator, name: Nexus, role: Orchestrator, description: "Sprint management + Autopilot + Parallel execution" }
    skills: [bmad-plus-autopilot, bmad-plus-parallel, bmad-plus-sync, bmad-plus-uat]
    data: [role-triggers.yaml]
    install_layout: loose
    compliance_tags: []

  osint:
    order: 1
    display_name: "OSINT Intelligence"
    icon_emoji: "🔍"
    cli: { name: "OSINT", icon: "j", desc: "OSINT & investigation" }
    required: false
    runtime: [node]
    summary: "Investigation & scraping (55+ Apify actors, 7 APIs)."
    agents: [agent-shadow]
    personas:
      - { id: agent-shadow, name: Shadow, role: OSINT, description: "Investigation + Public-source research (governed, legal basis required)" }
    # CLI installs no skill dirs for osint today (module.yaml lists
    # bmad-osint-investigate, but packs.js — the runtime truth — ships none).
    skills: []
    external_package: osint-agent-package
    install_layout: loose
    # GOVERNANCE GATE (audit CG-02): psychoprofiling of named persons requires
    # explicit lawful basis + consent + retention config before the pack runs.
    governance:
      requires_lawful_basis: true
      pii_processing: true
      consent_gate: true
      templates: [ropa, dsar, retention-policy]
    required_keys: [APIFY_API_TOKEN]
    optional_keys: [PERPLEXITY_API_KEY, EXA_API_KEY, TAVILY_API_KEY, JINA_API_KEY]
    compliance_tags: [GDPR, EU-AI-Act]

  maker:
    order: 2
    display_name: "Agent Creator"
    icon_emoji: "🧬"
    cli: { name: "Maker", icon: "f", desc: "Agent creation toolkit" }
    required: false
    runtime: [node]
    summary: "Design, build, validate, and package new BMAD+-compatible agents."
    agents: [agent-maker]
    personas:
      - { id: agent-maker, name: Maker, role: Agent Creator, description: "Design, build, validate, and package new BMAD+ agents" }
    skills: []
    data: [] # packs.js declares an (empty) data key for maker — kept for parity
    install_layout: loose
    compliance_tags: []

  shield:
    order: 3
    display_name: "Shield — GRC Compliance"
    icon_emoji: "🛡️"
    cli: { name: "Shield", icon: "m", desc_template: "GRC compliance ({framework_count} frameworks)" }
    required: false
    runtime: [node]
    # summary count is GENERATED from the lists below, never typed.
    summary_template: "{agent_count} compliance agents + {workflow_count} workflows across {framework_count}+ frameworks."
    agents: [shield-orchestrator] # orchestrator entry point, shipped inside pack_dir
    personas:
      - { id: shield-orchestrator, name: Shield, role: GRC, description: "Compliance agents for GDPR, ISO 27001, SOC 2, HIPAA, EU AI Act, DORA, NIS2 and more" }
    skills: []
    orchestrator: shield-orchestrator
    pack_dir: pack-shield
    pack_src_dir: packs
    install_layout: packaged
    doctor:
      pack_agents: [shield-orchestrator.md]
      # review-rules/ is what `bmad-plus review` loads from an installed Shield pack.
      required_resources: [SKILL.md, review-rules/index.yaml]
    categories:
      - {
          id: data-privacy,
          name: "Data Privacy",
          agents: [gdpr-agent, ccpa-agent, lgpd-agent, dpdpa-agent, iso27701-agent],
        }
      - {
          id: cybersecurity,
          name: "Cybersecurity",
          agents:
            [iso27001-agent, nist-csf-agent, nist-800-53-agent, cis-controls-agent, nis2-agent, ism-agent],
        }
      - {
          id: industry-compliance,
          name: "Industry Compliance",
          agents: [soc2-agent, pci-dss-agent, hipaa-agent, swift-csp-agent, dora-agent, fedramp-agent],
        }
      - {
          id: defense-export,
          name: "Defense & Export Control",
          agents: [cmmc-agent, itar-agent, ear-agent, tsa-agent],
        }
      - {
          id: ai-governance,
          name: "AI Governance",
          agents: [eu-ai-act-agent, iso42001-agent, nist-ai-rmf-agent],
        }
      - {
          id: accessibility-esg,
          name: "Accessibility & ESG",
          agents: [wcag-agent, section508-agent, csrd-agent],
        }
    workflows:
      [
        dpia-sentinel,
        breach-sentinel,
        legitimate-interest,
        privacy-advisor,
        privacy-notice-gen,
        privacy-policy-gen,
        cookie-policy-gen,
        ai-act-classifier,
        ai-act-roles,
        ai-act-fria,
        ai-act-incidents,
      ]
    compliance_tags:
      [
        GDPR,
        CCPA,
        LGPD,
        ISO27001,
        ISO27701,
        ISO42001,
        SOC2,
        PCI-DSS,
        HIPAA,
        EU-AI-Act,
        DORA,
        NIS2,
        NIST-CSF,
        NIST-800-53,
        NIST-AI-RMF,
        CIS,
        CMMC,
        ITAR,
        EAR,
        FedRAMP,
        WCAG,
        Section508,
        CSRD,
        SWIFT-CSP,
        ISM,
        TSA,
      ]

  seo:
    order: 4
    display_name: "SEO Audit 360"
    icon_emoji: "🔍"
    cli: { name: "SEO", icon: "k", desc: "SEO audit & optimization" }
    required: false
    runtime: [node, python] # In-pack toolkit; provisioning is opt-in.
    summary_template: "{agent_count} agents (Scout, Chief, Judge) + 6-phase audit + PageSpeed loop."
    agents: [seo-scout, seo-chief, seo-judge]
    personas:
      - { id: seo-scout, name: SEO Scout, role: Technical Scanner, description: "Crawling + technical inspection + performance" }
      - { id: seo-chief, name: SEO Chief, role: Strategist & Reporter, description: "Scoring + strategy + reporting" }
      - { id: seo-judge, name: SEO Judge, role: Content & AI Analyst, description: "Content quality + structured data + GEO analysis" }
    skills: []
    pack_dir: pack-seo
    pack_src_dir: packs
    install_layout: packaged
    doctor:
      pack_agents: [seo-scout.md, seo-chief.md, seo-judge.md]
      required_resources: [SKILL.md]
    python_package: src/bmad-plus/packs/pack-seo # scripts shipped in-pack (embarked) → reachable from npm
    python_entry: scripts/seo_fetch.py
    python_verify_modules: [requests, bs4, defusedxml, lxml]
    compliance_tags: [GDPR] # pulls GA/GSC personal data → tagged for governance

  memory:
    order: 5
    display_name: "Memory — Persistent Brain"
    icon_emoji: "🧠"
    cli: { name: "Memory", icon: "x", desc: "Persistent cross-session memory" }
    required: false
    runtime: [node] # File-based memory; separately deployed RAG is not in npm.
    summary: "Cross-session memory + project scanner + Karpathy guardrails."
    agents: [zecher]
    personas:
      - { id: zecher, name: Zecher, role: Memory Archivist, description: "Persistent cross-session memory, consolidation, project scanning, context recall, session handoffs", alias: "זכר, Memory Guardian" }
    skills: []
    pack_dir: pack-memory
    pack_src_dir: packs
    install_layout: packaged
    doctor:
      pack_agents: [zecher-agent.md, memory-orchestrator.md]
    cohabitation_warning: "Detects and links existing brains (_brain/, ~/.claude/memory/); NEVER overwrites memory files."
    compliance_tags: []

  dev-studio:
    order: 6
    display_name: "Dev Studio — Full SDLC"
    icon_emoji: "🏗️"
    cli: { name: "Dev Studio", icon: "v", desc_template: "SDLC automation ({sub_agent_count} agents, specialized workflows)" }
    required: false
    runtime: [node]
    # GENERATED: "{agent_count} agents + {workflow_count} workflows" — computed
    # from the lists below (kills the "30 vs 44 workflows" contradiction DOC-06).
    summary_template: "{agent_count} specialized agents + {workflow_count} workflows: Analysis → Planning → Architecture → Implementation → Review."
    agents: [dev-studio-orchestrator] # what the CLI installs (the orchestrator entry point)
    skills: [dev-studio]
    orchestrator: dev-studio-orchestrator
    pack_dir: pack-dev-studio
    pack_src_dir: packs
    install_layout: packaged
    doctor:
      pack_agents: [dev-studio-orchestrator.md]
      # Public entry and shared contract, including the old UX continuation path.
      required_resources:
        - SKILL.md
        - shared/catalog.json
        - shared/execution.md
        - categories/planning/create-ux-design.md
        - categories/planning/steps/step-01-init.md
    cohabitation_warning: "Dev Studio agents overlap with Core (Atlas/Forge/Sentinel/Nexus); both can coexist."
    sub_agents:
      [analyst-agent, tech-writer-agent, pm-agent, ux-designer-agent, architect-agent, dev-agent]
    personas:
      - { id: analyst-agent, name: Miriam, role: Business Analyst, description: "Strategic analysis, research, product briefs", alias: מרים }
      - { id: tech-writer-agent, name: Huldah, role: Technical Writer, description: "Documentation, diagrams, editorial review", alias: חולדה }
      - { id: pm-agent, name: Yosef, role: Product Manager, description: "PRD, requirements, feature prioritization", alias: יוסף }
      - { id: ux-designer-agent, name: Rachel, role: UX Designer, description: "User experience, wireframes, empathy mapping", alias: רחל }
      - { id: architect-agent, name: Bezalel, role: System Architect, description: "Architecture, ADRs, epics & stories", alias: בצלאל }
      - { id: dev-agent, name: Oholiab, role: Senior Engineer, description: "TDD, sprint, code review, implementation", alias: אהליאב }
    categories:
      - {
          id: analysis,
          name: "Analysis",
          workflows:
            [product-brief, prfaq, document-project, market-research, domain-research, technical-research],
        }
      - {
          id: planning,
          name: "Planning",
          workflows: [create-prd, prd, edit-prd, validate-prd, create-ux-design],
        }
      - {
          id: architecture,
          name: "Architecture",
          workflows:
            [create-architecture, create-epics-stories, implementation-readiness, generate-project-context],
        }
      - {
          id: implementation,
          name: "Implementation",
          workflows:
            [
