  backup:
    order: 7
    display_name: "Universal Backup"
    icon_emoji: "🗂️"
    cli: { name: "Backup", icon: "y", desc: "Backup & restore" }
    required: false
    runtime: [node]
    summary: "Timestamped ZIP backup with smart exclusions."
    agents: [backup-agent]
    personas:
